name: Android Build

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.godot"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK build-tools & platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/jungle-bounce-debug.apk

      - name: Dump manifest info (orientation check)
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging build/jungle-bounce-debug.apk | grep -i orientation || echo "no explicit orientation found in badging dump"
          "$AAPT" dump xmltree build/jungle-bounce-debug.apk AndroidManifest.xml | grep -i -A2 "screenOrientation" || echo "no screenOrientation attribute found in manifest"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jungle-bounce-debug-apk
          path: build/*.apk
          if-no-files-found: error
